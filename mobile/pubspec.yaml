name: examsecure
description: Application mobile ExamSecure — vente et consultation sécurisée d'épreuves universitaires.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '3.47.1'

dependencies:
  flutter:
    sdk: flutter

  # État / architecture
  provider: ^6.1.2

  # Réseau
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # Stockage sécurisé (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Chiffrement local AES
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Fichiers / PDF
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  file_picker: ^8.1.7
  pdfx: ^2.6.0

  # Paiement
  kkiapay_flutter_sdk: ^1.3.4

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
